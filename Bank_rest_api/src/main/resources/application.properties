spring.application.name=BankAPI
spring.config.import=optional:file:.env[.properties]


#spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
#spring.jpa.defer-datasource-initialization=true
spring.h2.console.path=/h2-console

# Configure persistent H2 database
spring.datasource.url=jdbc:h2:file:./data/bankAPIdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Ensure schema initialization
spring.jpa.defer-datasource-initialization=false

#F2 Fix: Keystore and password removed from repo
server.port=8443
server.ssl.key-store=${KEYSTORE_PATH:file:./keystore/bankapi.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bankapi
server.ssl.key-store-password=${KEYSTORE_PASSWORD:}
server.ssl.enabled=true


jwt.key-store=${KEYSTORE_PATH:file:./keystore/bankapi.p12}
jwt.key-store-password=${KEYSTORE_PASSWORD:}
jwt.key-alias=bankapi

#F6 Fix: only the frontend may call the API from a browser
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
